# Default values for networth-dashboard.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.


backend:
  image:
    repository: "image-registry.openshift-image-registry.svc:5000/networth-ai/backend"
    pullPolicy: Always
    tag: "latest"

  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 200m
      memory: 512Mi

  cors:
    enabled: true
    allowedOrigins: "frontend-networth-dashboard.apps.ocp.khary.net"

  config:
    # LLM Configuration (for document processing)
    llmEnabled: "true"
    llmBaseUrl: "https://openrouter.ai/api/v1"
    llmModel: "google/gemma-3-4b-it"
    llmUploadDir: "/app/uploads"
    llmInsecureSkipVerify: "true"


frontend:
  replicaCount: 1
  image:
    repository: "image-registry.openshift-image-registry.svc:5000/networth-ai/frontend"
    pullPolicy: Always
    tag: "latest"

  ingress:
    annotations:
      route.openshift.io/termination: edge
      route.openshift.io/insecureEdgeTerminationPolicy: Redirect
    hosts:
      - host: frontend-networth-ai.apps.ocp.khary.net
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls: []

  resources:
    requests:
      cpu: 50m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 512Mi

# PostgreSQL dependency configuration
postgresql:
  enabled: true
  auth:
    database: networth_dashboard
    username: postgres
  primary:
    persistence:
      enabled: true
      size: 8Gi
